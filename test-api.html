<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #5568d3;
        }
        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .result {
            background: white;
            padding: 15px;
            margin-top: 10px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>🧪 AI 상담 앱 API 테스트</h1>

    <div class="test-section">
        <h2>1. 서버 상태 확인</h2>
        <button onclick="testHealth()">서버 확인</button>
        <div id="health-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>2. 회원가입 테스트</h2>
        <input type="text" id="signup-username" placeholder="사용자명" value="testuser">
        <input type="password" id="signup-password" placeholder="비밀번호" value="test1234">
        <button onclick="testSignup()">회원가입</button>
        <div id="signup-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>3. 로그인 테스트</h2>
        <input type="text" id="login-username" placeholder="사용자명" value="testuser">
        <input type="password" id="login-password" placeholder="비밀번호" value="test1234">
        <button onclick="testLogin()">로그인</button>
        <div id="login-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>4. 상담 테스트 (로그인 후)</h2>
        <select id="consult-type">
            <option value="saju">사주</option>
            <option value="worry">고민</option>
            <option value="tarot">타로</option>
            <option value="dream">꿈해몽</option>
        </select>
        <input type="text" id="consult-question" placeholder="질문" value="오늘 운세가 어떤가요?">
        <button onclick="testConsult()">상담받기</button>
        <div id="consult-result" class="result"></div>
    </div>

    <script>
        let token = '';

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            resultDiv.textContent = '테스트 중...';

            try {
                const response = await fetch('http://localhost:5000/api/health');
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.textContent = '✅ 서버 정상!\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ 에러: ' + error.message;
            }
        }

        async function testSignup() {
            const resultDiv = document.getElementById('signup-result');
            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;

            resultDiv.textContent = '테스트 중...';

            try {
                const response = await fetch('http://localhost:5000/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ 회원가입 성공!\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '❌ 회원가입 실패\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ 에러: ' + error.message;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            resultDiv.textContent = '테스트 중...';

            try {
                const response = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.token;
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ 로그인 성공!\n토큰이 저장되었습니다.\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '❌ 로그인 실패\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ 에러: ' + error.message;
            }
        }

        async function testConsult() {
            const resultDiv = document.getElementById('consult-result');
            const type = document.getElementById('consult-type').value;
            const question = document.getElementById('consult-question').value;

            if (!token) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ 먼저 로그인해주세요!';
                return;
            }

            resultDiv.textContent = '테스트 중...';

            try {
                const response = await fetch('http://localhost:5000/api/consult', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ type, question })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = '✅ 상담 성공!\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = '❌ 상담 실패\n' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = '❌ 에러: ' + error.message;
            }
        }
    </script>
</body>
</html>
